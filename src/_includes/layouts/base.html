<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ description }}">
<meta name="theme-color" content="#F5F3EC">
<link rel="canonical" href="{{ client.domain }}{{ page.url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ client.name }}">
<meta property="og:title" content="{{ ogTitle or title }}">
<meta property="og:description" content="{{ ogDescription or description }}">
<meta property="og:url" content="{{ client.domain }}{{ page.url }}">
<meta name="twitter:card" content="summary_large_image">
<title>{{ title }}</title>

<link rel="icon" type="image/png" href="/assets/favicons/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon.svg">
<link rel="shortcut icon" href="/assets/favicons/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png">
<link rel="manifest" href="/assets/favicons/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">

<script type="application/ld+json">
{"@context":"https://schema.org","@type":"ProfessionalService","name":"{{ client.name }}","legalName":"{{ client.legalName }}",
"url":"{{ client.domain }}","email":"{{ client.email }}","telephone":"{{ client.phoneForTel }}",
"description":"Brand, web and growth studio for service businesses across Ontario. Identity to launch, one team, no handoffs.",
"address":{"@type":"PostalAddress","streetAddress":"{{ client.address.lineOne }}","addressLocality":"{{ client.address.city }}","addressRegion":"{{ client.address.state }}","addressCountry":"{{ client.address.country }}"},
"areaServed":{"@type":"State","name":"Ontario"},"founder":{"@type":"Person","name":"Justice Okeke"},
"sameAs":["{{ client.socials.instagram }}"]}
</script>
</head>
<body>
{{ content | safe }}
<script src="/assets/js/site.js"></script>
</body>
</html>
